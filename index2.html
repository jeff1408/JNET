<!-- Formulário de Cobertura com Envio para o WhatsApp -->
<section style="max-width: 600px; margin: 40px auto; padding: 30px; background: linear-gradient(145deg, #132a4a, #0d1f38); border-radius: 15px; border: 2px solid #1e3d6b; text-align: center;">
    <h3 style="color: #fff; margin-bottom: 10px;"><i class="fa-solid fa-map-location-dot"></i> Consulte Disponibilidade</h3>
    <p style="color: #a0aec0; font-size: 0.9rem; margin-bottom: 20px;">Preencha os dados abaixo para verificarmos se a Fibra Óptica já passa na sua rua!</p>
    
    <form style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
        <label style="font-size: 0.85rem; color: #00bcd4; font-weight: bold;">Seu Nome:</label>
        <input type="text" id="cliente_nome" placeholder="Ex: João Silva" style="padding: 12px; border-radius: 8px; border: 1px solid #1e3d6b; background-color: #0b192c; color: #fff; outline: none;" required>
        
        <label style="font-size: 0.85rem; color: #00bcd4; font-weight: bold;">Endereço Completo:</label>
        <input type="text" id="cliente_endereco" placeholder="Rua, Número e Bairro" style="padding: 12px; border-radius: 8px; border: 1px solid #1e3d6b; background-color: #0b192c; color: #fff; outline: none;" required>
        
        <label style="font-size: 0.85rem; color: #00bcd4; font-weight: bold;">Plano de Interesse:</label>
        <select id="cliente_plano" style="padding: 12px; border-radius: 8px; border: 1px solid #1e3d6b; background-color: #0b192c; color: #fff; outline: none;">
            <option value="90 MEGA - R$ 69,90">90 MEGA - R$ 69,90</option>
            <option value="250 MEGA - R$ 79,90">250 MEGA - R$ 79,90</option>
            <option value="350 MEGA - R$ 89,90">350 MEGA - R$ 89,90</option>
        </select>

        <button type="button" onclick="enviarParaWhatsApp()" style="background-color: #00bcd4; color: #000; font-weight: bold; padding: 15px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-size: 1rem; text-transform: uppercase;">Verificar Disponibilidade</button>
    </form>
</section>

<!-- Script de Automação -->
<script>
    function enviarParaWhatsApp() {
        // Coleta os valores digitados pelo usuário
        const nome = document.getElementById('cliente_nome').value.trim();
        const endereco = document.getElementById('cliente_endereco').value.trim();
        const plano = document.getElementById('cliente_plano').value;

        // Validação básica para garantir o preenchimento
        if (nome === "" || endereco === "") {
            alert("Por favor, preencha o seu Nome e seu Endereço Completo antes de prosseguir.");
            return;
        }

        // Número do atendente (apenas dígitos, com código do país 55)
        const numeroTelefone = "5511913639759";

        // Monta o texto que chegará no WhatsApp de forma organizada
        const textoMensagem = `Olá! Gostaria de consultar a disponibilidade técnica para o meu endereço.%0A%0A` +
                              `📝 *Dados da Consulta:*%0A` +
                              `• *Nome:* ${encodeURIComponent(nome)}%0A` +
                              `• *Endereço:* ${encodeURIComponent(endereco)}%0A` +
                              `• *Plano Escolhido:* ${encodeURIComponent(plano)}`;

        // Cria a URL oficial do WhatsApp e redireciona o cliente
        const urlWhatsApp = `https://whatsapp.com{numeroTelefone}&text=${textoMensagem}`;
        window.open(urlWhatsApp, '_blank');
    }
</script>
